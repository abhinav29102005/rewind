[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rewind-guard"
version = "0.1.0"
description = "An enforced approval and undo layer for AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Rewind Contributors" },
]
keywords = ["ai", "agents", "safety", "guardrails", "mcp", "approval", "rollback"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "click>=8.0",
    "aiohttp>=3.9",
    "cryptography>=42.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "mcp>=1.0.0",
    "fastmcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
rewind = "rewind.cli:main"
rewind-mcp = "rewind.mcp_server:main"

[project.urls]
Homepage = "https://github.com/your-org/rewind"
Documentation = "https://github.com/your-org/rewind/tree/main/docs"
Repository = "https://github.com/your-org/rewind"
Issues = "https://github.com/your-org/rewind/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rewind", "benchmark"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["rewind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
