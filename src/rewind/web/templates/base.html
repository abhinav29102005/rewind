<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Rewind Control Plane{% endblock %}</title>
    <!-- HTMX for reactive updates without build tooling -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: "Inter", sans-serif; background-color: #000; color: #ededed; }
        .font-mono { font-family: "JetBrains Mono", monospace; }
        .glass-panel { background: #0a0a0a; border: 1px solid #222; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .tab-btn.active { color: #fff; border-bottom: 2px solid #fff; }
        .tab-btn { color: #888; border-bottom: 2px solid transparent; }
        .btn-primary { background: #fff; color: #000; font-weight: 500; border-radius: 6px; transition: 0.2s ease; }
        .btn-primary:hover { background: #ddd; }
        .btn-danger { background: #110000; color: #ff4444; border: 1px solid #ff4444; border-radius: 6px; transition: 0.2s ease; }
        .btn-danger:hover { background: #ff4444; color: #fff; }
        th { text-align: left; padding: 12px 16px; border-bottom: 1px solid #222; color: #666; font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
        td { padding: 14px 16px; border-bottom: 1px solid #111; font-size: 14px; }
        tr:hover td { background: #0c0c0c; }
        input, select { background: #000; border: 1px solid #333; color: #fff; padding: 8px 12px; border-radius: 6px; outline: none; transition: 0.2s ease; }
        input:focus, select:focus { border-color: #666; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-gray-800 selection:text-white">
    <!-- Header -->
    <header class="flex justify-between items-center px-8 py-5 border-b border-[#1a1a1a] bg-[#050505]">
        <div class="flex items-center gap-3">
            <i data-lucide="shield" class="text-white w-5 h-5"></i>
            <span class="font-semibold text-lg tracking-tight">Rewind <span class="text-gray-500 font-normal opacity-50 px-1">/</span> <span class="text-gray-300 font-normal text-sm">Security Gateway</span></span>
        </div>
        <div class="flex items-center gap-4 text-sm">
            <div class="flex items-center gap-2 bg-[#111] px-3 py-1.5 rounded-full border border-[#222]">
                <div class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></div>
                <span class="text-gray-300 text-xs font-medium">Gateway Active</span>
            </div>
            {% if current_user %}
            <span class="text-gray-500 ml-2">Session: <span class="text-white">{{ current_user.username }}</span></span>
            <span class="px-2 py-0.5 bg-[#111] rounded text-gray-400 text-xs border border-[#333] uppercase tracking-wider">{{ current_user.role.value }}</span>
            <form action="/logout" method="post" class="inline ml-2">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <button type="submit" class="text-gray-600 hover:text-white transition-colors" title="Logout"><i data-lucide="log-out" class="w-4 h-4"></i></button>
            </form>
            {% endif %}
        </div>
    </header>
    
    <main class="flex-1 p-8 max-w-[1200px] mx-auto w-full">
        {% block content %}{% endblock %}
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
