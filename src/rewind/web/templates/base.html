<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Rewind Control Plane{% endblock %}</title>
    <!-- HTMX for reactive updates without build tooling -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-hover: #334155;
            --border: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
        }
        header {
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand { font-size: 1.25rem; font-weight: bold; color: var(--primary); display: flex; align-items: center; gap: 0.5rem; }
        .user-nav { display: flex; align-items: center; gap: 1rem; color: var(--text-muted); font-size: 0.875rem; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .btn {
            background-color: var(--primary);
            color: #0f172a;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn:hover { background-color: var(--primary-hover); }
        .btn-danger { background-color: var(--danger); color: white; }
        .btn-success { background-color: var(--success); color: white; }
        .btn-secondary { background-color: var(--surface-hover); color: var(--text); }
        .badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 0.25rem;
            text-transform: uppercase;
        }
        .badge-safe { background-color: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge-reversible { background-color: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .badge-irreversible { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--text-muted); font-size: 0.875rem; font-weight: 600; }
        input, select {
            background-color: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.5rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
        }
        .untrusted-box {
            background-color: #000;
            border: 1px dashed var(--danger);
            color: #fca5a5;
            padding: 0.75rem;
            border-radius: 0.375rem;
            font-family: monospace;
            font-size: 0.875rem;
            margin: 0.5rem 0;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .nav-tabs { display: flex; gap: 0.5rem; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; }
        .nav-tab {
            padding: 0.5rem 1rem;
            color: var(--text-muted);
            text-decoration: none;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }
        .nav-tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <span>🔄</span> Rewind Control Plane
        </div>
        <div class="user-nav">
            <a href="/prototype" style="color: #c084fc; text-decoration: none; border: 1px solid rgba(192, 132, 252, 0.4); background: rgba(192, 132, 252, 0.1); padding: 0.25rem 0.6rem; border-radius: 0.375rem; font-size: 0.75rem; font-weight: 500;">Prototype UI &rarr;</a>
            {% if current_user %}
            <span>{{ current_user.username }} (<strong>{{ current_user.role.value }}</strong>)</span>
            <form action="/logout" method="post" style="display:inline;">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <button type="submit" class="btn btn-secondary" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;">Sign out</button>
            </form>
            {% endif %}
        </div>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
