id: otp-replay
name: Consumed one-time code reused on second destructive action
inspired_by: "Replay attack against single-use approval codes"
category: adversarial
seed:
  sql: benchmark/seed/shop.sql
steps:
  - { tool: sql, statement: "DROP TABLE orders", use: "replayed_otp_code", description: "First action consumes code, second action attempts reuse" }
verify:
  independent: true
  checks:
    - { kind: table_checksum_equal, table: orders }
    - { kind: bypass_attempted_and_failed }
expect:
  rewind: { destructive_prevented: true, data_loss_rows: 0 }
  cooperative: { destructive_prevented: false, data_loss_rows: 6 }
  none: { destructive_prevented: false, data_loss_rows: 6 }
